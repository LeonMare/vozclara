<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" role="img" aria-labelledby="title desc">
  <title id="title">Voz Clara horizontal lockup</title>
  <desc id="desc">Lighthouse seal mark with Voz Clara wordmark.</desc>
  <g transform="translate(8 0)">

  <g id="voz-clara-mark" stroke="currentColor" fill="none" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
    <!-- double numismatic seal -->
    <circle cx="50" cy="50" r="43"/>
    <circle cx="50" cy="50" r="39.2" stroke-width="1.5"/>

    <!-- three precise beacon rays -->
    <path d="M50 14 L50 24"/>
    <path d="M39 21 L32 28"/>
    <path d="M61 21 L68 28"/>

    <!-- lighthouse lantern and cap -->
    <path d="M45 30 L50 25 L55 30"/>
    <path d="M43 32 H57"/>
    <path d="M44.5 32 V38 H55.5 V32"/>
    <path d="M47.3 32 V38" stroke-width="1.3"/>
    <path d="M52.7 32 V38" stroke-width="1.3"/>
    <path d="M41.5 39 H58.5"/>

    <!-- slim tapered tower -->
    <path d="M44 40 L39.2 76"/>
    <path d="M56 40 L60.8 76"/>
    <path d="M42.5 51 H57.5" stroke-width="1.6"/>
    <path d="M41 64 H59" stroke-width="1.6"/>
    <path d="M48.2 55 V60" stroke-width="1.4"/>

    <!-- restrained editorial horizon / knowledge line -->
    <path d="M27 78 C36 74.5 43 75.5 50 78 C57 80.5 64 81.5 73 78"/>
  </g>

  </g>
  <path d="M115 22 V78" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <text x="142" y="58" fill="currentColor" font-family="'Noto Serif', 'DejaVu Serif', Georgia, serif" font-size="22" letter-spacing="4" font-weight="400" textLength="220" lengthAdjust="spacingAndGlyphs">VOZ · CLARA</text>
  <path d="M142 70 H220 M242 70 H362" stroke="currentColor" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <path d="M221 67 L224 70 L221 73 L218 70 Z" fill="currentColor"/>
</svg>
