<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Voz Clara Mark</title>
  <desc id="desc">Numismatic lighthouse seal for Voz Clara, built with currentColor hairline paths.</desc>

  <g id="voz-clara-mark" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
    <!-- double numismatic seal -->
    <circle cx="50" cy="50" r="43"/>
    <circle cx="50" cy="50" r="39.2" stroke-width="1.6500000000000001"/>

    <!-- three precise beacon rays -->
    <path d="M50 14 L50 24"/>
    <path d="M39 21 L32 28"/>
    <path d="M61 21 L68 28"/>

    <!-- lighthouse lantern and cap -->
    <path d="M45 30 L50 25 L55 30"/>
    <path d="M43 32 H57"/>
    <path d="M44.5 32 V38 H55.5 V32"/>
    <path d="M47.3 32 V38" stroke-width="1.4300000000000002"/>
    <path d="M52.7 32 V38" stroke-width="1.4300000000000002"/>
    <path d="M41.5 39 H58.5"/>

    <!-- slim tapered tower -->
    <path d="M44 40 L39.2 76"/>
    <path d="M56 40 L60.8 76"/>
    <path d="M42.5 51 H57.5" stroke-width="1.7600000000000002"/>
    <path d="M41 64 H59" stroke-width="1.7600000000000002"/>
    <path d="M48.2 55 V60" stroke-width="1.54"/>

    <!-- restrained editorial horizon / knowledge line -->
    <path d="M27 78 C36 74.5 43 75.5 50 78 C57 80.5 64 81.5 73 78"/>
  </g>

</svg>
