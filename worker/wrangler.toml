name = "vozclara-transcript"
main = "src/index.ts"
compatibility_date = "2026-05-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Plain-text vars — these are NOT secrets (those are managed via
# `wrangler secret put`). Used to construct the Cloudflare AI Gateway
# baseURL for Anthropic API calls (Sonnet 4.5 for Pro Plus tier).
# Set Di 19.5.2026 — see MASTER.md §1.2 and IDEAS §10.
#
# Gateway endpoint:
#   https://gateway.ai.cloudflare.com/v1/${CF_ACCOUNT_ID}/${CF_AI_GATEWAY_ID}/anthropic/v1/messages
#
# Authentication: BYOK pattern — `x-api-key` header from ANTHROPIC_API_KEY
# secret. Cloudflare AI Gateway acts as observability + caching layer.
[vars]
CF_ACCOUNT_ID = "761d7d94786e7b0d2ceaafc75dfe8282"
CF_AI_GATEWAY_ID = "vozclara-prod"

# Cloudflare Workers AI binding. Llama 3.1/3.3 used for genre-aware
# Summary / Insights / Action Plan extraction (Free + Pro tier).
# Free tier covers our expected volume (10 000 neurons/day ≈ several
# hundred summaries). Pro Plus tier upgrades to Claude Sonnet 4.5 via
# Anthropic API (see [vars] above).
# Also used by /api/ask for the bge-base-en-v1.5 embedding model when
# Vectorize is enabled.
[ai]
binding = "AI"

# Vectorize binding — semantic search backend for /api/ask. Without it,
# /api/ask falls back to prompt-stuffing the entire library (capped at
# 40 packs). The index must be provisioned once before `wrangler deploy`:
#
#   wrangler vectorize create vozclara-knowledge --dimensions=768 --metric=cosine
#
# Free tier: 30M queried / 50M stored vector dimensions per month.
# At 768 dims × ~40 chunks per pack that's roughly 1.5k packs of
# headroom and effectively unlimited queries for personal-scale usage.

[[vectorize]]
binding = "VECTORIZE"
index_name = "vozclara-knowledge"

# KV — Web Push subscriptions, keyed by anonymous brainId.
[[kv_namespaces]]
binding = "PUSH_SUBS"
id = "cfd42230e80345ed9cba587136e8919d"

# KV — magic-link auth (users, sessions, magic tokens, email index).
# Provisioned 2026-05-18 via `wrangler kv namespace create vc-auth`.
[[kv_namespaces]]
binding = "AUTH"
id = "32113624ca574c16867b434f453b3237"

# KV — OAuth 2.1 provider storage. Required by
# `@cloudflare/workers-oauth-provider` to persist registered clients,
# authorization codes, access tokens, and refresh tokens. Provisioned
# 2026-05-20 via `wrangler kv namespace create OAUTH_KV`. The library
# stores only hashes of secrets, not the raw values.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "42d926deae1047c89461be6e793ff552"

# Durable Object — VozClara MCP server (CLAUDE.md §1.5).
# The `agents` SDK builds McpAgent on top of Durable Objects to persist
# per-session state across the Streamable-HTTP and SSE transports. The
# class itself lives in worker/src/mcp/agent.ts and is re-exported from
# worker/src/index.ts so wrangler can resolve it.
[[durable_objects.bindings]]
name = "MCP_AGENT"
class_name = "VozClaraMcpAgent"

# DO migration registering the SQLite-backed McpAgent class. SQLite is
# the default for new DO classes (post-Sept-2025 compat dates) — using
# `new_sqlite_classes` ensures the platform creates a SQLite-backed DO
# rather than the legacy KV-style storage.
[[migrations]]
tag = "v1-mcp"
new_sqlite_classes = ["VozClaraMcpAgent"]

# Crons:
#   • Hourly tick → push notifications when (localHour == reminderHour
#     AND nextDueAt <= now AND lastNotifiedYmd != today)
#   • Daily at 19:30 UTC → curated-pack auto-generation: pulls the
#     latest matching video from configured YouTube channels, stores a
#     CuratedItem in KV that the /api/curated endpoint serves.
[triggers]
# Three crons:
#   0 * * * *    → hourly push-notification dispatcher (worker/src/index.ts:runPushCron)
#   30 19 * * *  → daily 19:30 UTC curated-pack auto-generation
#   0 9 * * *    → daily 09:00 UTC retention-email sweep (Day 2/3/5/7 cadence)
#                  See worker/src/retention.ts. Morning EU + late
#                  evening US-Pacific is the sweet spot for the
#                  initial sweep — both audiences see the email in
#                  their inbox at a natural reading moment.
crons = ["0 * * * *", "30 19 * * *", "0 9 * * *"]

# Local dev runs on http://localhost:8787 — the Vite dev server in
# /vite.config.ts proxies /api/* to that port.

# Worker is routed on the production domain — frontend calls /api/*
# same-origin. scripts/deploy.mjs detects this block and writes empty
# VITE_API_BASE + VITE_SITE_URL=https://vozclara.app into .env.production.

[[routes]]
pattern = "vozclara.app/api/*"
zone_name = "vozclara.app"

# OAuth provider endpoints. Without these routes Cloudflare Pages
# catches the paths and returns the SPA HTML instead of the OAuth
# JSON/UI. Discovered Mi 20.5.2026 during the Phase 2 smoke test —
# `/.well-known/oauth-authorization-server` was returning index.html.
#
#   /oauth/authorize       → Hono consent UI (worker/src/oauth/handler.ts)
#   /oauth/token           → OAuthProvider native handler
#   /oauth/register        → RFC-7591 dynamic client registration
#   /.well-known/oauth-*   → RFC-8414 metadata discovery
[[routes]]
pattern = "vozclara.app/oauth/*"
zone_name = "vozclara.app"

[[routes]]
pattern = "vozclara.app/.well-known/*"
zone_name = "vozclara.app"

[observability]
enabled = true

# Cache config — the Worker's own response cache is enabled via the
# Cache-Control header on responses, no extra config needed here.
