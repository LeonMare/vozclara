<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1A3A" />
    <meta name="description" content="VozClara turns any video you watch into a searchable Knowledge Pack — summaries, vocabulary, citations, in your language. For language learners, knowledge workers, and students." />

    <!-- Open Graph / social cards -->
    <meta property="og:title" content="VozClara — Stop losing what you watch." />
    <meta property="og:description" content="Save any video. Get back the ideas, the vocabulary, and the citations — in your language. Free, anonymous-first, GDPR-compliant." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VozClara — lighthouse seal in gold on navy. Tagline: Stop losing what you watch." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VozClara by LEON MARÉ" />

    <!-- Twitter Card — same image, distinct title/description that read well
         in the smaller Twitter preview. summary_large_image renders the
         1200×630 og:image natively, no separate twitter:image needed. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VozClara — Stop losing what you watch." />
    <meta name="twitter:description" content="Turn any YouTube video into a Knowledge Pack you can search years later. First 100 founders pay €99 once." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="VozClara — lighthouse seal in gold on navy." />

    <!-- iOS PWA chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voz Clara" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS PWA splash screens. Without these, the installed app shows a
         white flash for ~1 s on cold-start. With them, iOS displays a
         brand-coloured splash that matches the running app. Each entry
         must match an iPhone's CSS-pixel dimensions × device-pixel-ratio
         exactly; devices outside the list fall back to the nearest. -->
    <link rel="apple-touch-startup-image" href="/splash/1290x2796.png"
          media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1179x2556.png"
          media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1170x2532.png"
          media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/1125x2436.png"
          media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/828x1792.png"
          media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/750x1334.png"
          media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <!-- Favicons: SVG for modern browsers, PNG fallbacks for older ones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts — universal foundation + per-language display serifs.
         All called out in LEON MARÉ Brand Foundation v5 Kap. 16.
           • Cinzel              — caps wordmark, all locales
           • Cormorant Garamond  — display serif, EN (default) + universal fallback
           • Inter               — UI sans, all locales
           • Spectral            — display serif, :lang(de) — Germanic editorial,
                                   designed by Production Type for sustained reading
           • Libre Caslon Text   — display serif, :lang(es) — warm humanist Latin,
                                   bridges the Caslon tradition into Spanish setting
           • Source Serif 4      — display serif, :lang(pt) — modern, clean, holds
                                   the Brazilian + Portuguese diacritic combinations
                                   without ascender clashes
         All four serif families are free via Google Fonts (no €500 licence
         needed for the launch budget — commercial-grade families can land
         post-revenue if a designer wants to differentiate further).
         font-display=swap so text renders with Georgia fallback while the
         locale-specific face loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />

    <title>Voz Clara · A LEON MARÉ product</title>

    <!-- Schema.org structured data via JSON-LD. Single @graph with
         three cross-referenced entities so Google can render rich
         snippets: WebSite (Sitelinks search box), Organization (LEON
         MARÉ as publisher), SoftwareApplication (free + founder-deal
         offers, multilingual support, EducationalApplication category).
         %VITE_SITE_URL% gets substituted at build time same as the
         og:url + og:image lines above. -->
    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "%VITE_SITE_URL%/#website",
      "url": "%VITE_SITE_URL%/",
      "name": "VozClara",
      "alternateName": "VozClara by LEON MARÉ",
      "description": "Multilingual YouTube to Knowledge Pack engine. Summary, key ideas, vocabulary, flashcards, quiz, and transcript in Spanish, Portuguese, German, or English.",
      "inLanguage": ["es", "pt", "de", "en"],
      "publisher": { "@id": "%VITE_SITE_URL%/#org" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "%VITE_SITE_URL%/library?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    },
    {
      "@type": "Organization",
      "@id": "%VITE_SITE_URL%/#org",
      "name": "LEON MARÉ",
      "url": "https://leonmare.de",
      "founder": {
        "@type": "Person",
        "name": "Christian José Gonçalves Leon"
      }
    },
    {
      "@type": "SoftwareApplication",
      "@id": "%VITE_SITE_URL%/#app",
      "name": "VozClara",
      "url": "%VITE_SITE_URL%/",
      "applicationCategory": "EducationalApplication",
      "applicationSubCategory": "Language Learning",
      "operatingSystem": "Web",
      "description": "Turn any YouTube video into a structured Knowledge Pack — summary, flashcards, quiz, transcript — in Spanish, Portuguese, German, or English. Anki export, OAuth-gated library search, RAG Q&A on a single pack, MCP server for Claude Desktop and Cursor.",
      "inLanguage": ["es", "pt", "de", "en"],
      "offers": [
        {
          "@type": "Offer",
          "name": "Free during beta",
          "price": "0",
          "priceCurrency": "EUR",
          "availability": "https://schema.org/InStock"
        },
        {
          "@type": "Offer",
          "name": "Founder Deal — lifetime Pro Plus, capped at 100 seats",
          "price": "99",
          "priceCurrency": "EUR",
          "availability": "https://schema.org/LimitedAvailability",
          "url": "%VITE_SITE_URL%/founder"
        }
      ],
      "publisher": { "@id": "%VITE_SITE_URL%/#org" },
      "featureList": [
        "YouTube transcript extraction with timestamps",
        "Multilingual summaries (ES, PT, DE, EN)",
        "CEFR-tuned vocabulary extraction (A1 to C1)",
        "Anki .apkg deck export with sentence-context cards",
        "Spaced repetition review",
        "Voice shadowing with pronunciation scoring",
        "AI tutor chat per pack",
        "Library search across saved packs",
        "MCP server for Claude Desktop, Cursor, Continue",
        "OAuth 2.1 with PKCE S256",
        "GDPR Article 13 + 17 compliant, EU AI Act Article 50 compliant",
        "Cookieless analytics, no tracking, no model training on user content"
      ]
    }
  ]
}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Cloudflare Web Analytics — privacy-friendly, no cookies.
         Loaded only when VITE_CF_BEACON_TOKEN is set (deploy env);
         absent in dev / on staging where it would just 404. -->
    <script>
      (function () {
        var token = "%VITE_CF_BEACON_TOKEN%";
        if (!token || token.charAt(0) === "%") return;
        var s = document.createElement("script");
        s.defer = true;
        s.src = "https://static.cloudflareinsights.com/beacon.min.js";
        s.setAttribute("data-cf-beacon", JSON.stringify({ token: token }));
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
